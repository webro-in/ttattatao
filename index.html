
<!doctype html>
<html lang="en-IN">
  <head>
    <!-- =====================================
         BASIC HTML & MOBILE SETTINGS
    ====================================== -->

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- =====================================
         SEO TITLE
    ====================================== -->

    <title>
      Ttattatao | Chinese Cloud Kitchen in Jaipur | Order Online
    </title>

    <!-- =====================================
         SEO DESCRIPTION
    ====================================== -->

    <meta
      name="description"
      content="Order delicious Chinese and Asian food in Jaipur from Ttattatao. Explore veg dumplings, noodles, fried rice, chilli paneer and Thai curries. Build your order and send it via WhatsApp."
    />

    <!-- =====================================
         GOOGLE SEARCH ENGINE SETTINGS
    ====================================== -->

    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <meta
      name="googlebot"
      content="index, follow, max-image-preview:large, max-snippet:-1"
    />

    <!-- =====================================
         BRAND / BROWSER COLOURS
    ====================================== -->

    <meta name="theme-color" content="#260a05" />

    <meta name="color-scheme" content="light" />

    <meta
      name="application-name"
      content="Ttattatao"
    />

    <meta
      name="apple-mobile-web-app-title"
      content="Ttattatao"
    />

    <meta
      name="apple-mobile-web-app-capable"
      content="yes"
    />

    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    />

    <!-- =====================================
         WEBSITE FAVICONS
    ====================================== -->

    <link
      rel="icon"
      href="/favicon.ico"
      sizes="any"
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
    />

    <!-- =====================================
         APPLE / MOBILE ICON
    ====================================== -->

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <!-- =====================================
         PWA MANIFEST
    ====================================== -->

    <link
      rel="manifest"
      href="/site.webmanifest"
    />

    <!-- =====================================
         OPEN GRAPH - FACEBOOK / WHATSAPP
    ====================================== -->

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:locale"
      content="en_IN"
    />

    <meta
      property="og:site_name"
      content="Ttattatao"
    />

    <meta
      property="og:title"
      content="Ttattatao | Chinese Cloud Kitchen in Jaipur"
    />

    <meta
      property="og:description"
      content="Good Food. Good Mood. Explore delicious veg dumplings, noodles, fried rice and Asian specials from Ttattatao, Jaipur. Send your order request via WhatsApp."
    />

    <!-- =====================================
         TWITTER / X SOCIAL PREVIEW
    ====================================== -->

    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="Ttattatao | Chinese Cloud Kitchen Jaipur"
    />

    <meta
      name="twitter:description"
      content="Fresh Asian flavours, made for your cravings. Discover dumplings, noodles, fried rice and more at Ttattatao, Jaipur."
    />

    <!-- =====================================
         GEO / LOCAL BUSINESS INFORMATION
    ====================================== -->

    <meta
      name="geo.region"
      content="IN-RJ"
    />

    <meta
      name="geo.placename"
      content="Jaipur, Rajasthan, India"
    />
